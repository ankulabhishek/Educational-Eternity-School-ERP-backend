# Example: Node API on 127.0.0.1:5000, public URL https://YOUR_DOMAIN/EducationalEternity/...
# Paste inside your server { } block and adjust PORT if needed.
#
# CRITICAL: proxy_pass must NOT add an extra path unless you intend to strip the prefix.
# Use the form below so the browser path /EducationalEternity/login reaches Node as /EducationalEternity/login

location /EducationalEternity/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

